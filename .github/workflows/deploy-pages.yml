name: Deploy web to GitHub Pages

on:
  push:
    branches: [main, claude/invitation-mockup-generator-ytzp34]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # GitHub Pages 프로젝트 사이트는 /<repo>/ 하위에서 서빙되므로 base-href 지정.
      - run: flutter build web --release --base-href "/pilot-invitation-visualize/"

      # Pages가 비활성 상태면 자동으로 켠다(빌드 소스: GitHub Actions).
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
